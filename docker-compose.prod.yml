services:
  caddy:
    image: caddy:2-alpine
    container_name: iterim-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ./backend/iterimApi
      dockerfile: Dockerfile.prod
    container_name: iterim-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=${MYSQL_DATABASE};User Id=${MYSQL_USER};Password=${MYSQL_PASSWORD};
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${DOMAIN}
      - JwtSettings__Audience=${DOMAIN}
      - JwtSettings__AccessTokenExpirationMinutes=15
      - JwtSettings__RefreshTokenExpirationDays=7
      - Cors__AllowedOrigins__0=https://${DOMAIN}
      - Email__FrontendBaseUrl=https://${DOMAIN}
      - Email__Provider=Smtp
      - Email__FromAddress=${SMTP_FROM_ADDRESS}
      - Email__FromName=Iterim
      - Email__Smtp__Host=${SMTP_HOST}
      - Email__Smtp__Port=${SMTP_PORT}
      - Email__Smtp__Username=${SMTP_USERNAME}
      - Email__Smtp__Password=${SMTP_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/iterimWeb
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=https://${DOMAIN}/api
    container_name: iterim-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  mysql:
    image: mysql:8.4
    container_name: iterim-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - iterim_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  iterim_mysql_data:
  caddy_data:
  caddy_config:
