services:
  backend:
    build:
      context: ./backend/iterimApi
      dockerfile: Dockerfile
    container_name: iterim-backend
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=iterimdb;User Id=interim_user;Password=interim_dev_pass;
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend/iterimWeb
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: iterim-frontend
    restart: unless-stopped
    ports:
      - "5173:3000"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - NODE_ENV=development
    depends_on:
      - backend

  mysql:
    image: mysql:8.4
    container_name: iterim-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_pass
      MYSQL_DATABASE: iterimdb
      MYSQL_USER: interim_user
      MYSQL_PASSWORD: interim_dev_pass
    ports:
      - "3306:3306"
    volumes:
      - iterim_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: iterim-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: interim_user
      PMA_PASSWORD: interim_dev_pass
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  iterim_mysql_data: