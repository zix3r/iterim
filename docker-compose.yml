services:
  mysql:
    image: mysql:8.4
    container_name: iterim-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_pass
      MYSQL_DATABASE: iterimdb
      MYSQL_USER: interim_user
      MYSQL_PASSWORD: interim_dev_pass
    ports:
      - "3306:3306"
    volumes:
      - iterim_mysql_data:/var/lib/mysql

volumes:
  iterim_mysql_data: